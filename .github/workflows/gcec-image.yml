name: build-casdoor-image

# Builds a Casdoor image carrying the sambaNTPassword backfill patch and
# publishes it to GHCR, so the office Casdoor stack can pull it directly.
#
# The upstream Dockerfile is multi-stage (node -> golang -> alpine STANDARD),
# so this is also the real compile verification for the patch.

on:
  push:
    branches: [gcec-ntlm-hash]
    tags: ['v*-gcec*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check formatting of the patched files
        run: |
          set -e
          gofmt -l util/ntlm.go object/user_nt.go controllers/auth.go controllers/user.go | tee /tmp/fmt
          test ! -s /tmp/fmt || { echo "::error::gofmt reported unformatted files"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: STANDARD
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/thyk123/casdoor:${{ github.ref_name }}
            ghcr.io/thyk123/casdoor:gcec-ntlm-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
